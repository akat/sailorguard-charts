version: "3.8"

# Production stack for https://charts.sailorguard.com behind the shared Traefik
# (network "proxy", Let's Encrypt resolver "le").
#
#   sailorguard-charts            nginx, serves tiles + manifest from the volume
#   sailorguard-charts-generator  one-shot job: builds tiles from EMODnet into the
#                                 volume, then exits. Runs on every deploy/redeploy;
#                                 tiles already built are skipped.
#
# Stack variables (all optional):
#   CHART_AREAS        areas to build, space separated (generator/regions.json):
#                      mediterranean black-sea atlantic-iberia biscay-channel
#                      british-isles north-sea baltic norway
#   CHART_CONCURRENCY  parallel EMODnet requests (default 3)

services:
  sailorguard-charts:
    image: ${IMAGE:-ghcr.io/akat/sailorguard-charts:latest}
    pull_policy: always
    restart: unless-stopped
    volumes:
      - charts-data:/usr/share/nginx/html:ro
    labels:
      - "traefik.enable=true"
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.sailorguard-charts.rule=Host(`charts.sailorguard.com`)"
      - "traefik.http.routers.sailorguard-charts.entrypoints=websecure"
      - "traefik.http.routers.sailorguard-charts.tls.certresolver=le"
      - "traefik.http.services.sailorguard-charts.loadbalancer.server.port=8080"
    networks:
      - proxy

  sailorguard-charts-generator:
    image: ${GENERATOR_IMAGE:-ghcr.io/akat/sailorguard-charts-generator:latest}
    pull_policy: always
    restart: "no"
    environment:
      AREAS: ${CHART_AREAS:-mediterranean black-sea}
      CONCURRENCY: ${CHART_CONCURRENCY:-3}
    volumes:
      - charts-data:/app/public

volumes:
  charts-data:
    name: sailorguard-charts-data

networks:
  proxy:
    external: true
