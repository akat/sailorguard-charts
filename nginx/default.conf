# charts.sailorguard.com: static depth tiles and manifest for the SailorGuard app.
# TLS is terminated by Traefik; this only serves files from the data volume.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;

    # The manifest changes when tiles are (re)generated: always revalidate.
    location = /v1/manifest.json {
        default_type application/json;
        gzip on;
        gzip_types application/json;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Tiles live under a dataset version folder and never change in place.
    location /v1/tiles/ {
        types { application/octet-stream sgd; }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
